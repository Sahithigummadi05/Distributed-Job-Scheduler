spring:
  application:
    name: distributed-job-scheduler
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobscheduler}
    username: ${DB_USER:jobscheduler}
    password: ${DB_PASSWORD:jobscheduler}
  flyway:
    enabled: true

scheduler:
  worker-id: ${WORKER_ID:${HOSTNAME:worker-local}}
  poll-interval-ms: 500
  batch-size: 10
  execution-threads: 4
  backoff-base-seconds: 2
  backoff-max-seconds: 300
  # A claim is a lease: if a worker dies without reporting an outcome, its jobs are returned to
  # the queue after this long. Must exceed the slowest legitimate job, or a slow job gets
  # reclaimed and run a second time while the first attempt is still running.
  lease-timeout-seconds: 300
  reaper-interval-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

server:
  port: 8080

logging:
  level:
    com.sahithi.jobscheduler: INFO
