spring:
  application:
    name: distributed-job-scheduler
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobscheduler}
    username: ${DB_USER:jobscheduler}
    password: ${DB_PASSWORD:jobscheduler}
  flyway:
    enabled: true

scheduler:
  worker-id: ${WORKER_ID:${HOSTNAME:worker-local}}
  poll-interval-ms: 500
  batch-size: 10
  execution-threads: 4
  backoff-base-seconds: 2
  backoff-max-seconds: 300
  backoff-jitter-seconds: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

server:
  port: 8080

logging:
  level:
    com.sahithi.jobscheduler: INFO
